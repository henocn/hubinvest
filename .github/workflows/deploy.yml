name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hubinvest-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.VPS_APP_PATH }}
          PM2_APP_NAME: hubinvest-api
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 20m
          envs: DEPLOY_PATH,PM2_APP_NAME
          script: |
            set -e

            # 1. Code : la version de GitHub s'impose. Une modification locale (package-lock.json
            #    après un npm install manuel, par exemple) est écrasée au lieu de bloquer le déploiement.
            #    Les fichiers ignorés par git (.env, uploads, dist, node_modules) ne sont pas touchés.
            cd "$DEPLOY_PATH"
            git fetch --prune origin main
            git checkout -f main
            git reset --hard origin/main
            echo "Version déployée : $(git log --oneline -1)"

            # 2. Dépendances des trois dossiers. npm ci installe exactement le package-lock.json
            #    sans jamais le réécrire, donc sans créer de nouveau conflit.
            for app in backend frontend backoffice; do
              cd "$DEPLOY_PATH/$app"
              npm ci --include=dev --no-audit --no-fund
            done

            # 3. Builds du site public et de l'espace équipe.
            for app in frontend backoffice; do
              cd "$DEPLOY_PATH/$app"
              npm run build
            done

            # 4. Migrations de la base.
            cd "$DEPLOY_PATH/backend"
            export NODE_ENV=production
            npm run db:migrate

            # 5. Redémarrage de l'API sans coupure.
            pm2 reload "$PM2_APP_NAME" --update-env
            pm2 save
