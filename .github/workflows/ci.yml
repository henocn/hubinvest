name: CI

# Vérifie que le site public et l'espace équipe se construisent, à chaque push sur main
# et à chaque pull request de dev vers main. Les tests se lancent en local avant la mise en ligne.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    if: github.event_name == 'push' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backoffice]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      VITE_API_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
